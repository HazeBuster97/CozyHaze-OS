# CozyHaze OS - Calamares Partitions-Konfiguration
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M

# Standard-Dateisystem: Bewährtes ext4 für Stabilität auf SATA-SSD
defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"
  - "btrfs"

# LUKS-Vollverschlüsselung aktivieren
enableLuksAutomatedPartitioning: true

# Sicherheitsvorgabe: Niemals automatische Löschung ohne Auswahl vorselektieren
initialPartitioningChoice: none

# Immer Datenträgerbezeichnungen und Modell anzeigen (verhindert versehentliches Überschreiben)
alwaysShowPartitionLabels: true

# Erfordert mindestens GPT bei EFI-Systemen
partitionLayout:
    - name: "EFI System Partition"
      filesystem: "fat32"
      mountPoint: "/boot/efi"
      size: 512M
      attributes: 0x8000000000000000
    - name: "CozyHaze Root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
