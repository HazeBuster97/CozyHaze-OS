# CozyHaze OS - GRUB Default Konfiguration für MacBookPro8,2
# Pfad im System: /etc/default/grub.d/cozyhaze.cfg

# Kernel-Befehlszeile für Intel HD 3000 und Blockierung der defekten Radeon GPU
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash i915.modeset=1 i915.lvds_channel_mode=2 i915.lvds_use_ssc=0 radeon.modeset=0 amdgpu.modeset=0"

# Boot-Menü Zeitlimit (Sekunden)
GRUB_TIMEOUT=4

# OS-Prober aktivieren, um Multi-Boot (macOS / Linux) zu unterstützen
GRUB_DISABLE_OS_PROBER=false

# Grafikmodus für GRUB (native Auflösung des 15"-Displays: 1440x900 oder 1680x1050)
GRUB_GFXMODE=1440x900,1024x768,auto
GRUB_GFXPAYLOAD_LINUX=keep

# CozyHaze OS Theme aktivieren
GRUB_THEME="/boot/grub/themes/cozyhaze/theme.txt"
