# CozyHaze OS - Apple Keyboard Belegung & Verhalten
# fnmode=2: F1-F12 Tasten fungieren primär als echte Funktionstasten (ideal für Entwicklung & F5/F12),
#           Helligkeit/Lautstärke via Druck auf [Fn] + F-Taste.
# swap_opt_cmd=1: Vertauscht Cmd (Apple) und Opt (Alt), sodass das Layout dem gewohnten
#                 PC-Standard entspricht (Cmd = Super/Windows-Taste, Opt = Alt-Taste).

options hid_apple fnmode=2
options hid_apple swap_opt_cmd=1
