# CozyHaze OS - Bootmenü-Einträge für MacBook Pro 2011 & UEFI-Systeme

menuentry "CozyHaze OS Live starten (Intel HD 3000 Standard)" --class cozyhaze --class gnu-linux --class os {
    # Apple GMUX Hardware-Switching: Display auf Intel iGPU schalten, defekte Radeon stromlos schalten
    if [ "${grub_platform}" = "efi" ] || [ "${grub_platform}" = "pc" ]; then
        outb 0x728 1
        outb 0x710 2
        outb 0x740 2
        outb 0x750 0
    fi
    linux  /live/vmlinuz boot=live components quiet splash i915.modeset=1 i915.lvds_channel_mode=2 i915.lvds_use_ssc=0 radeon.modeset=0 amdgpu.modeset=0 locales=de_DE.UTF-8 keyboard-layouts=de
    initrd /live/initrd.img
}

menuentry "CozyHaze OS im sicheren Grafikmodus starten (nomodeset)" --class recovery --class gnu-linux {
    linux  /live/vmlinuz boot=live components nomodeset radeon.modeset=0 amdgpu.modeset=0 locales=de_DE.UTF-8 keyboard-layouts=de
    initrd /live/initrd.img
}

menuentry "Intel-Grafikdiagnose & Hardware-Status starten" --class hardware --class gnu-linux {
    if [ "${grub_platform}" = "efi" ] || [ "${grub_platform}" = "pc" ]; then
        outb 0x728 1
        outb 0x710 2
        outb 0x740 2
        outb 0x750 0
    fi
    linux  /live/vmlinuz boot=live components systemd.unit=multi-user.target i915.modeset=1 radeon.modeset=0 cozyhaze.autodiag=1 locales=de_DE.UTF-8 keyboard-layouts=de
    initrd /live/initrd.img
}

menuentry "CozyHaze OS installieren (Calamares Installer)" --class calamares --class gnu-linux {
    if [ "${grub_platform}" = "efi" ] || [ "${grub_platform}" = "pc" ]; then
        outb 0x728 1
        outb 0x710 2
        outb 0x740 2
        outb 0x750 0
    fi
    linux  /live/vmlinuz boot=live components quiet splash i915.modeset=1 i915.lvds_channel_mode=2 i915.lvds_use_ssc=0 radeon.modeset=0 cozyhaze.autoinstall=1 locales=de_DE.UTF-8 keyboard-layouts=de
    initrd /live/initrd.img
}

submenu "Erweiterte Optionen & EFI-Rettung..." {
    menuentry "Apple GMUX Direkt-Umschaltung im Textmodus ausführen" {
        outb 0x728 1
        outb 0x710 2
        outb 0x740 2
        outb 0x750 0
        echo "GMUX Hardware-Register geschrieben. Starte Boot..."
        sleep 2
        linux  /live/vmlinuz boot=live components i915.modeset=1 radeon.modeset=0 locales=de_DE.UTF-8 keyboard-layouts=de
        initrd /live/initrd.img
    }

    menuentry "Firmware-Setup / UEFI-BIOS aufrufen" {
        fwsetup
    }

    menuentry "System neu starten" {
        reboot
    }

    menuentry "System herunterfahren" {
        halt
    }
}
