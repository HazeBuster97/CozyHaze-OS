# CozyHaze OS - GRUB Hauptkonfiguration für Live-ISO & Apple-EFI
set default=0
set timeout=5

# Theme und Grafikmodus
set gfxmode=1440x900,1024x768,auto
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

# CozyHaze Theme laden
set theme=/boot/grub/themes/cozyhaze/theme.txt
export theme

# Lokalisierung
loadfont /boot/grub/fonts/unicode.pf2 2>/dev/null || true

# Menüeinträge inkludieren
source /boot/grub/live.cfg
