# CozyHaze OS - Hardware-Spezifische Modulkonfiguration für MacBookPro8,2
# Verhindert das Laden aller AMD/Radeon Treiber, um die defekte dGPU nicht zu aktivieren.

# Primäre AMD Kernelmodule blockieren
blacklist radeon
blacklist amdgpu

# Sicherstellen, dass die Treiber auch nicht indirekt geladen werden
install radeon /bin/true
install amdgpu /bin/true

# Zusätzliche Absicherung: Modesetting für radeon strikt deaktivieren
options radeon modeset=0
options amdgpu modeset=0
