# CozyHaze OS - LightDM GTK Greeter Konfiguration
# Elegantes Login-Interface im CozyHaze Dark Neon Design

[greeter]
background = /usr/share/backgrounds/cozyhaze-wallpaper.jpg
theme-name = Adwaita-dark
icon-theme-name = Papirus-Dark
cursor-theme-name = DMZ-White
font-name = Segoe UI, Roboto, Ubuntu 11
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb

# Zentriertes Anmeldefenster
position = 50%,center 50%,center
default-user-image = /usr/share/pixmaps/cozyhaze-logo.png

# Uhren- und Statusleiste
indicators = ~host;~spacer;~clock;~spacer;~language;~session;~power
clock-format = %a, %d. %b %Y • %H:%M

# Sicherheit & Barrierefreiheit
screensaver-timeout = 60
user-background = false
